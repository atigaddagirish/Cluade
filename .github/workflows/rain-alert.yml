# Commute rain alerts — sends a Telegram message before each trip if rain is
# likely at Manikonda / Office. Needs repo secrets TELEGRAM_BOT_TOKEN and
# TELEGRAM_CHAT_ID (see scripts/rain_alert.py header + README). Without them the
# job runs but only logs what it *would* send.
#
# Times: GitHub cron is UTC and best-effort (can slip a few min). Two checks per
# commute: an EARLY heads-up (only pings if rain is coming) and a FINAL go/no-go
# near departure (always pings — 🟢 good-to-ride on dry days).
name: Commute rain alert

on:
  schedule:
    - cron: "0 2 * * *"     # 07:30 IST — morning early heads-up
    - cron: "15 3 * * *"    # 08:45 IST — morning FINAL (Manikonda → Office)
    - cron: "15 11 * * *"   # 16:45 IST — evening early heads-up
    - cron: "15 12 * * *"   # 17:45 IST — evening FINAL (Office → Manikonda)
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification regardless of rain"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check commute rain and notify
        env:
          # ntfy: zero-setup push. Subscribe to this exact topic in the free
          # "ntfy" app to get the alerts. A secret NTFY_TOPIC overrides it.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC != '' && secrets.NTFY_TOPIC || 'wwrain-98cfa8f8dd' }}
          # optional Telegram (leave unset if using ntfy)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_MODE: auto        # picks morning/evening by current IST hour
          # FINAL checks (08:45 / 17:45 IST) always send a go/no-go; EARLY checks
          # (07:30 / 16:45) only ping if rain is coming. Manual test always sends.
          ALERT_ALWAYS: ${{ ((github.event_name == 'workflow_dispatch' && inputs.test) || github.event.schedule == '15 3 * * *' || github.event.schedule == '15 12 * * *') && '1' || '' }}
          ALERT_STAGE: ${{ (github.event.schedule == '0 2 * * *' || github.event.schedule == '15 11 * * *') && 'early' || 'final' }}
        run: python3 scripts/rain_alert.py
